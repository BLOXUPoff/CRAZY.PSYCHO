<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image</title>

    <!-- Discord : URLs injectées automatiquement au déploiement Vercel (build.js) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Image">
    <meta property="og:description" content=" ">
    <meta property="og:url" content="https://CHANGE-MOI.com/">
    <meta property="og:image" content="https://CHANGE-MOI.com/pfp.jpg">
    <meta property="og:image:secure_url" content="https://CHANGE-MOI.com/pfp.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="1200">
    <meta property="og:image:alt" content="Image">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://CHANGE-MOI.com/pfp.jpg">
    <link rel="canonical" href="https://CHANGE-MOI.com/">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        img {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
        }
        .info-panel {
            position: fixed;
            bottom: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px 18px;
            border-radius: 10px;
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 13px;
            line-height: 1.5;
            max-width: min(360px, calc(100vw - 40px));
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .info-panel--left { left: 20px; }
        .info-panel--right { right: 20px; }
        .info-panel h3 {
            margin: 0 0 10px;
            font-size: 15px;
            font-weight: 600;
            color: #7dd3fc;
        }
        .info-panel p { margin: 0; }
        .info-panel b { color: #bae6fd; font-weight: 500; }
        .info-panel .loading { color: #94a3b8; font-style: italic; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 6px;
            background: rgba(34, 197, 94, 0.25);
            color: #86efac;
        }
        .badge--warn {
            background: rgba(251, 191, 36, 0.25);
            color: #fde047;
        }
        @media (max-width: 700px) {
            .info-panel {
                left: 10px !important;
                right: 10px !important;
                max-width: none;
            }
            .info-panel--right { bottom: auto; top: 10px; }
            .info-panel--left { bottom: 10px; }
        }
    </style>
</head>
<body>
    <img src="pfp.jpg" alt="Image">

    <div class="info-panel info-panel--left" id="location-panel">
        <h3>Localisation <span class="badge" id="geo-api-badge">…</span></h3>
        <p id="location-text" class="loading">Chargement…</p>
    </div>

    <div class="info-panel info-panel--right" id="device-panel">
        <h3>Appareil</h3>
        <p id="device-text" class="loading">Chargement…</p>
    </div>

    <script>
        const locationText = document.getElementById('location-text');
        const deviceText = document.getElementById('device-text');
        const geoApiBadge = document.getElementById('geo-api-badge');

        function ipToDecimal(ip) {
            if (!ip || !ip.includes('.')) return null;
            return ip.split('.').reduce((acc, octet) => (acc << 8) + parseInt(octet, 10), 0) >>> 0;
        }

        function line(label, value) {
            if (value === undefined || value === null || value === '') return '';
            return `<b>${label}:</b> ${value}<br>`;
        }

        function renderLocation(data, apiName) {
            geoApiBadge.textContent = apiName;
            let html = '';
            html += line('IP', data.ip);
            if (data.ip && data.ip.includes('.')) {
                html += line('IP (décimal)', ipToDecimal(data.ip));
            }
            html += line('Pays', data.country);
            if (data.countryCode) html += line('Code pays', data.countryCode);
            html += line('Région', data.region);
            html += line('Ville', data.city);
            if (data.postal) html += line('Code postal', data.postal);
            html += line('Latitude', data.latitude);
            html += line('Longitude', data.longitude);
            if (data.timezone) html += line('Fuseau horaire', data.timezone);
            html += line('FAI / ISP', data.isp);
            html += line('Organisation', data.org);
            html += line('ASN', data.asn);
            if (data.hostname) html += line('Hostname', data.hostname);
            if (data.mobile !== undefined) html += line('Connexion mobile', data.mobile ? 'Oui' : 'Non');
            if (data.proxy !== undefined) html += line('Proxy / VPN', data.proxy ? 'Détecté' : 'Non détecté');
            locationText.innerHTML = html || '<span class="loading">Aucune donnée</span>';
            locationText.classList.remove('loading');
        }

        function renderDevice(data) {
            let html = '';
            html += line('Type', data.deviceType);
            html += line('Système', data.os);
            if (data.osVersion) html += line('Version OS', data.osVersion);
            html += line('Navigateur', data.browser);
            if (data.browserVersion) html += line('Version navigateur', data.browserVersion);
            html += line('Plateforme', data.platform);
            html += line('Langue', data.language);
            if (data.languages) html += line('Langues', data.languages);
            html += line('Écran', data.screen);
            html += line('Ratio pixels', data.pixelRatio);
            html += line('Fuseau (local)', data.timezone);
            html += line('Cœurs CPU', data.cores);
            if (data.memory) html += line('Mémoire (Go)', data.memory);
            html += line('Tactile', data.touch);
            if (data.connection) html += line('Réseau', data.connection);
            if (data.battery) html += line('Batterie', data.battery);
            html += line('User-Agent', `<span style="word-break:break-all;font-size:11px;color:#cbd5e1">${data.userAgent}</span>`);
            deviceText.innerHTML = html;
            deviceText.classList.remove('loading');
        }

        function parseGeo(d) {
            if (!d?.ip) return null;
            return d;
        }

        /** APIs compatibles navigateur (CORS) — geojs en premier */
        const geoProviders = [
            {
                name: 'geojs.io',
                url: 'https://get.geojs.io/v1/ip/geo.json',
                parse: (raw) => parseGeo({
                    ip: raw.ip,
                    country: raw.country,
                    countryCode: raw.country_code,
                    region: raw.region,
                    city: raw.city,
                    latitude: raw.latitude,
                    longitude: raw.longitude,
                    timezone: raw.timezone,
                    org: raw.organization_name,
                    asn: raw.asn ? `AS${raw.asn}` : null
                })
            },
            {
                name: 'freeipapi.com',
                url: 'https://freeipapi.com/api/json/',
                parse: (raw) => parseGeo({
                    ip: raw.ipAddress,
                    country: raw.countryName,
                    countryCode: raw.countryCode,
                    region: raw.regionName,
                    city: raw.cityName,
                    latitude: raw.latitude,
                    longitude: raw.longitude,
                    timezone: raw.timeZone,
                    isp: raw.isp,
                    org: raw.organization,
                    asn: raw.asn
                })
            },
            {
                name: 'ipwho.is',
                url: 'https://ipwho.is/',
                parse: (raw) => (raw.success === false || !raw.ip) ? null : parseGeo({
                    ip: raw.ip,
                    country: raw.country,
                    countryCode: raw.country_code,
                    region: raw.region,
                    city: raw.city,
                    postal: raw.postal,
                    latitude: raw.latitude,
                    longitude: raw.longitude,
                    timezone: raw.timezone?.id,
                    isp: raw.connection?.isp,
                    org: raw.connection?.org,
                    asn: raw.connection?.asn ? `AS${raw.connection.asn}` : null,
                    mobile: raw.connection?.type === 'mobile',
                    proxy: raw.security?.proxy || raw.security?.vpn || raw.security?.tor
                })
            }
        ];

        /** Secours JSONP (fonctionne même en file:// quand fetch est bloqué) */
        const geoJsonpProviders = [
            {
                name: 'geojs.io',
                url: 'https://get.geojs.io/v1/ip/geo.json',
                parse: geoProviders[0].parse
            },
            {
                name: 'ip-api.com',
                url: 'http://ip-api.com/json/?fields=status,message,query,country,countryCode,regionName,city,zip,lat,lon,timezone,isp,org,as,mobile,proxy,hosting',
                parse: (raw) => (raw.status !== 'success' || !raw.query) ? null : parseGeo({
                    ip: raw.query,
                    country: raw.country,
                    countryCode: raw.countryCode,
                    region: raw.regionName,
                    city: raw.city,
                    postal: raw.zip,
                    latitude: raw.lat,
                    longitude: raw.lon,
                    timezone: raw.timezone,
                    isp: raw.isp,
                    org: raw.org,
                    asn: raw.as,
                    mobile: raw.mobile,
                    proxy: raw.proxy
                })
            }
        ];

        function fetchJsonp(url, timeoutMs = 12000) {
            return new Promise((resolve, reject) => {
                const cb = '_geoJsonp_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                let script;
                const cleanup = () => {
                    clearTimeout(timer);
                    delete window[cb];
                    if (script?.parentNode) script.parentNode.removeChild(script);
                };
                const timer = setTimeout(() => {
                    cleanup();
                    reject(new Error('timeout'));
                }, timeoutMs);
                window[cb] = (data) => {
                    cleanup();
                    resolve(data);
                };
                script = document.createElement('script');
                script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + encodeURIComponent(cb);
                script.onerror = () => {
                    cleanup();
                    reject(new Error('jsonp'));
                };
                document.head.appendChild(script);
            });
        }

        async function tryGeoProviders(providers, useJsonp) {
            for (const provider of providers) {
                try {
                    const raw = useJsonp
                        ? await fetchJsonp(provider.url)
                        : await (async () => {
                            const res = await fetch(provider.url, { cache: 'no-store' });
                            if (!res.ok) return null;
                            return res.json();
                        })();
                    if (!raw) continue;
                    const data = provider.parse(raw);
                    if (data?.ip) {
                        renderLocation(data, provider.name + (useJsonp ? ' (JSONP)' : ''));
                        return true;
                    }
                } catch {
                    /* essai suivant */
                }
            }
            return false;
        }

        async function fetchGeoLocation() {
            if (await tryGeoProviders(geoProviders, false)) return;
            if (await tryGeoProviders(geoJsonpProviders, true)) return;

            geoApiBadge.textContent = 'erreur';
            geoApiBadge.classList.add('badge--warn');
            locationText.innerHTML =
                '<b>Erreur:</b> impossible de récupérer la localisation.<br>' +
                '<span style="color:#94a3b8;font-size:12px">Ouvre la page via un serveur local ' +
                '(pas en double-clic) : <code style="color:#cbd5e1">npx serve .</code> puis ' +
                '<code style="color:#cbd5e1">http://localhost:3000</code>. ' +
                'Désactive aussi les bloqueurs de pub pour ce site.</span>';
            locationText.classList.remove('loading');
        }

        function getClientDeviceInfo() {
            const nav = navigator;
            const scr = screen;
            const conn = nav.connection || nav.mozConnection || nav.webkitConnection;
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;

            let connection = null;
            if (conn) {
                const parts = [
                    conn.effectiveType,
                    conn.downlink != null ? `${conn.downlink} Mbps` : null,
                    conn.rtt != null ? `RTT ${conn.rtt} ms` : null,
                    conn.saveData ? 'économie données' : null
                ].filter(Boolean);
                connection = parts.join(' · ') || null;
            }

            return {
                platform: nav.platform || nav.userAgentData?.platform || '—',
                language: nav.language,
                languages: nav.languages?.join(', '),
                screen: `${scr.width}×${scr.height} (dispo ${scr.availWidth}×${scr.availHeight})`,
                pixelRatio: window.devicePixelRatio,
                timezone: tz,
                cores: nav.hardwareConcurrency ?? '—',
                memory: nav.deviceMemory != null ? nav.deviceMemory : null,
                touch: nav.maxTouchPoints > 0 ? `${nav.maxTouchPoints} points` : 'Non',
                connection,
                userAgent: nav.userAgent
            };
        }

        async function parseUserAgent(ua) {
            try {
                const res = await fetch(`https://api.apicagent.com/?ua=${encodeURIComponent(ua)}`);
                if (!res.ok) return null;
                const d = await res.json();
                return {
                    deviceType: d.device?.type || '—',
                    os: d.os?.name,
                    osVersion: d.os?.version,
                    browser: d.client?.name,
                    browserVersion: d.client?.version
                };
            } catch {
                return null;
            }
        }

        function parseUserAgentFallback(ua) {
            const mobile = /Mobile|Android|iPhone|iPad/i.test(ua);
            let os = '—';
            if (/Windows NT/i.test(ua)) os = 'Windows';
            else if (/Mac OS X/i.test(ua)) os = 'macOS';
            else if (/Android/i.test(ua)) os = 'Android';
            else if (/iPhone|iPad/i.test(ua)) os = 'iOS';
            else if (/Linux/i.test(ua)) os = 'Linux';

            let browser = '—';
            if (/Edg\//i.test(ua)) browser = 'Edge';
            else if (/Chrome\//i.test(ua)) browser = 'Chrome';
            else if (/Firefox\//i.test(ua)) browser = 'Firefox';
            else if (/Safari\//i.test(ua)) browser = 'Safari';

            return {
                deviceType: mobile ? 'mobile' : 'desktop',
                os,
                browser
            };
        }

        async function fetchBattery() {
            if (!navigator.getBattery) return null;
            try {
                const b = await navigator.getBattery();
                const pct = Math.round(b.level * 100);
                const status = b.charging ? 'en charge' : 'sur batterie';
                return `${pct}% (${status})`;
            } catch {
                return null;
            }
        }

        async function fetchDeviceInfo() {
            const base = getClientDeviceInfo();
            const uaParsed = (await parseUserAgent(base.userAgent)) || parseUserAgentFallback(base.userAgent);
            const battery = await fetchBattery();

            renderDevice({
                ...uaParsed,
                ...base,
                battery
            });
        }

        fetchGeoLocation();
        fetchDeviceInfo();
    </script>
</body>
</html>
